spring:
  application:
    name: moodflow

  datasource:
    url: jdbc:mariadb://localhost:3306/moodflow
    username: root
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never